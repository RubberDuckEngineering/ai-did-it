name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  pack-zip:
    name: attach the pack zip to a release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync
      - name: build the zip, refusing a tag that disagrees with the pack version
        run: uv run python -m tools.build_pack_zip --out "dist/aididit-${GITHUB_REF_NAME}.zip" --expect-version "$GITHUB_REF_NAME"
      - name: attest the zip's build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/aididit-${{ github.ref_name }}.zip
      - name: create the release with the zip attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/aididit-${GITHUB_REF_NAME}.zip" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md for what changed in $GITHUB_REF_NAME."
