name: security

# Gitleaks reads every commit for secrets; Trivy reads uv.lock for dependencies with a HIGH or
# CRITICAL CVE. Both gate pull requests and pushes to main, and run weekly because a new CVE can
# land on a lockfile nobody touched. Results go to the Security tab from main and the weekly run;
# a pull request only gets the pass or fail, because Dependabot's runs cannot write there.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: no secret anywhere in the history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.30.1"
          EXPECTED_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          wget -qO "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${EXPECTED_SHA256}  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: scan every commit
        run: |
          gitleaks version
          gitleaks git --redact --exit-code 1 --report-format sarif --report-path gitleaks.sarif .
      - name: publish to the Security tab
        if: always() && github.event_name != 'pull_request' && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  dependencies:
    name: no dependency with a high or critical CVE
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install trivy
        run: |
          set -euo pipefail
          TRIVY_VERSION="0.76.2"
          EXPECTED_SHA256="bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf"
          archive="$RUNNER_TEMP/trivy.tar.gz"
          wget -qO "$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${EXPECTED_SHA256}  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" trivy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: scan uv.lock
        run: |
          trivy --version
          trivy fs . --scanners vuln --severity HIGH,CRITICAL --exit-code 1
      - name: write results for the Security tab
        if: always() && github.event_name != 'pull_request'
        run: trivy fs . --scanners vuln --severity HIGH,CRITICAL --format sarif --output trivy.sarif
      - name: publish to the Security tab
        if: always() && github.event_name != 'pull_request' && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif
          category: trivy
