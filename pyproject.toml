[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-did-it"
version = "0.2.3"
description = "A·I·DID·IT — an agile expansion pack for GitHub Spec Kit: seven lifecycle stages, a simulated agile team, and a practitioner panel that runs the whole delivery loop."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Rubber Duck Engineering" }]
keywords = ["spec-kit", "spec-driven-development", "agile", "xp", "ai-agents", "claude", "copilot"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  # Spec Kit ships inside this tool's environment so `aididit install` works out of the box.
  "specify-cli>=1.3.0,<2",
]

[project.urls]
Homepage = "https://github.com/RubberDuckEngineering/ai-did-it"
Issues = "https://github.com/RubberDuckEngineering/ai-did-it/issues"
Changelog = "https://github.com/RubberDuckEngineering/ai-did-it/blob/main/CHANGELOG.md"

[project.scripts]
aididit = "aididit.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pyyaml>=6"]
diagrams = ["playwright>=1.50"]

[tool.hatch.build.targets.wheel]
packages = ["src/aididit"]

[tool.hatch.build.targets.sdist]
include = ["src/aididit", "tests", "tools", "docs", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "e2e: drives the real `specify` CLI against a temporary project (slower, needs specify-cli installed)",
  "diagrams: renders every Mermaid diagram in a browser (needs `uv run --group diagrams` and Microsoft Edge)",
]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["aididit", "tools"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
